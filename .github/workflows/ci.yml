name: CI for Climate Insights

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci
    
      - name: Check code style
        run: npm run lint

      - name: Run tests
        run: npm test
 